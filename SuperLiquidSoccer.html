<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Liquid Soccer</title>
  <link rel="icon" type="image/x-icon" href="/MainFavicon.ico">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <h1 class="custom-text">Super Liquid Soccer</h1>

  <iframe src="https://jasongamesdev.github.io/subway-surfers/"
          width="1200"
          height="600"
          frameborder="0"
          allowfullscreen></iframe>

  <button id="fs-btn">Fullscreen</button>

  <script>
    var url = "https://jasongamesdev.github.io/subway-surfers/";
    var win;
    var btn = document.getElementById('fs-btn');

    btn.onclick = function() {
      if (win && !win.closed) {
        win.focus();
      } else {
        win = window.open();
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        var iframe = win.document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.margin = '0';
        iframe.src = url;
        win.document.body.appendChild(iframe);
      }
      btn.style.background = 'grey';
    };
  </script>

  <p><a href="games.html">Back to Games</a></p>
  <p><a href="index.html">Back to Home</a></p>
</body>
</html>
