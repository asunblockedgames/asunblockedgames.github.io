<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subway Surfers San Francisco</title>

  <link rel="icon" type="image/x-icon" href="/MainFavicon.ico">
  <link rel="stylesheet" href="main.css">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .custom-text {
      margin-bottom: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 1200px;
      height: min(600px, 70vh);
      min-height: 300px;
      margin: 0 auto;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .game-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .game-container:fullscreen {
      width: 100%;
      height: 100%;
      max-width: none;
      min-height: 0;
      border-radius: 0;
      background: #000;
    }

    #fs-btn {
      margin: 15px 0;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #fs-btn:hover {
      background: #0056b3;
    }

    #fs-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .navigation {
      margin-top: 20px;
    }

    .navigation a {
      margin: 0 10px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .game-container {
        height: 60vh;
        min-height: 250px;
      }
    }
  </style>
</head>

<body>

  <h1 class="custom-text">
    Subway Surfers San Francisco
  </h1>

  <div class="game-container" id="game-container">
    <iframe
      src="https://jasongamesdev.github.io/subway-surfers/"
      title="Subway Surfers San Francisco"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <button id="fs-btn" type="button">
    Fullscreen
  </button>

  <p id="fs-status" aria-live="polite"></p>

  <div class="navigation">
    <p><a href="games.html">Back to Games</a></p>
    <p><a href="index.html">Back to Home</a></p>
  </div>

  <script>
    const gameContainer = document.getElementById("game-container");
    const fullscreenButton = document.getElementById("fs-btn");
    const status = document.getElementById("fs-status");

    function updateFullscreenButton() {
      const isFullscreen =
        document.fullscreenElement === gameContainer;

      fullscreenButton.textContent =
        isFullscreen ? "Exit Fullscreen" : "Fullscreen";
    }

    fullscreenButton.addEventListener("click", async () => {
      fullscreenButton.disabled = true;

      try {
        if (document.fullscreenElement === gameContainer) {
          await document.exitFullscreen();
        } else if (gameContainer.requestFullscreen) {
          await gameContainer.requestFullscreen();
        } else {
          status.textContent =
            "Fullscreen is not supported by this browser.";
        }
      } catch (error) {
        status.textContent =
          "Fullscreen could not be opened. Check your browser permissions.";
      } finally {
        fullscreenButton.disabled = false;
        updateFullscreenButton();
      }
    });

    document.addEventListener(
      "fullscreenchange",
      updateFullscreenButton
    );

    updateFullscreenButton();
  </script>

</body>
</html>
